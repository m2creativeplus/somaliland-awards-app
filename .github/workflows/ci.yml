name: CI Verification

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci --legacy-peer-deps

    - name: Validate Identity Registry
      run: node -e 'require("./m2-identity.json"); console.log("m2-identity.json syntax valid!");'

    - name: Next.js Production Build
      run: npm run build
      env:
        NEXT_PUBLIC_SITE_URL: https://weddings.m2creative.sl
        PAYLOAD_SECRET: ci-temporary-validation-secret
